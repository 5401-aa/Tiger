
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI互動探索世界</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Microsoft JhengHei", sans-serif;
    background: linear-gradient(135deg, #fff8e7, #e8d4b5);
    display: flex;
    justify-content: center;
    align-items: center;
    color: #59452f;
}

.container {
    width: 90%;
    max-width: 550px;
    text-align: center;
    padding: 40px 25px;
    background: rgba(255,255,255,0.85);
    border-radius: 30px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.12);
}

h1 {
    font-size: 36px;
    margin-bottom: 15px;
    color: #805b30;
}

.subtitle {
    font-size: 18px;
    line-height: 1.8;
    margin-bottom: 35px;
}

.menu-button {
    display: block;
    width: 100%;
    padding: 22px 15px;
    margin: 20px 0;
    border-radius: 18px;
    color: white;
    text-decoration: none;
    font-size: 23px;
    font-weight: bold;
    box-shadow: 0 5px 12px rgba(0,0,0,0.15);
    transition: all 0.3s ease;
}

.menu-button:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    filter: brightness(1.08);
}

.story {
    background: linear-gradient(135deg, #d49b45, #b87930);
}

.game1 {
    background: linear-gradient(135deg, #649e83, #39745e);
}

.game {
    background: linear-gradient(135deg, #a48ac5, #785ba5);
}

.description {
    display: block;
    font-size: 14px;
    font-weight: normal;
    margin-top: 8px;
}

footer {
    margin-top: 35px;
    font-size: 13px;
    color: #927c63;
}

@media (max-width: 480px) {
    h1 {
        font-size: 28px;
    }

    .menu-button {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>AI 互動探索世界</h1>

    <p class="subtitle">
        歡迎來到我們的互動學習網站<br>
        開啟一段有趣的探索旅程
    </p>

    <a href="story.html" class="menu-button story">
        🎬 故事影片
        <span class="description">
            觀賞精彩的故事影片
        </span>
    </a>

    <a href="game1.html" class="menu-button game1">
        🌐 互動體驗
        <span class="description">
            開啟你的互動探索旅程
        </span>
    </a>

    <a href="game2.html" class="menu-button game">
        🎮 趣味小遊戲
        <span class="description">
            一起來挑戰有趣的小遊戲
        </span>
    </a>

    <footer>
        © 2026 AI互動學習網站
    </footer>

</div>

</body>
</html>
