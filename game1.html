<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>虎爺公・心靈好夥伴</title><style>body{margin:0;font-family:system-ui,'Noto Sans TC',sans-serif;background:linear-gradient(150deg,#fff4d8,#ffe0ba);color:#59391f;min-height:100vh;display:grid;place-items:center}.panel{width:min(90%,520px);background:#fffaf0;border:3px solid #e7b25b;border-radius:24px;padding:25px;text-align:center;box-shadow:0 12px 35px #8b582433}h1{font-size:1.8rem;margin:8px 0}.tiger{font-size:88px;line-height:1.4}textarea{width:100%;box-sizing:border-box;border:2px solid #e4c69b;border-radius:12px;padding:13px;font:inherit;min-height:100px;background:white}button{border:0;border-radius:28px;background:#c96c26;color:white;padding:12px 24px;margin:10px 5px;font-size:1rem;cursor:pointer}button.secondary{background:#947a58}button:focus-visible,textarea:focus-visible{outline:3px solid #4e8bb5}#result{margin-top:18px;padding:18px;background:#fff0cc;border-radius:14px;line-height:1.8;text-align:left}small{display:block;margin-top:16px;color:#80674e}</style></head><body><main class="panel"><div class="tiger" aria-hidden="true">🐯</div><h1>虎爺公・心靈好夥伴</h1><p>有什麼煩惱嗎？讓可愛虎爺陪你想一想！</p><label for="question">寫下你的生活疑問（可不填）</label><textarea id="question" placeholder="例如：最近讀書壓力很大，該怎麼辦？"></textarea><div><button id="guide">🐾 請給我指引</button><button id="again" class="secondary">重新提問</button></div><section id="result" aria-live="polite" hidden></section><small>本遊戲提供鼓勵與自我反思，不代表神諭、專業醫療、法律或財務建議。離線也能使用。</small></main><script>const messages=[['穩穩向前','先把大問題拆成一小步。今天完成一件小事，就是值得肯定的進展。'],['相信自己的步調','不必急著和別人比較。想想此刻最重要的事，給自己一些時間。'],['尋找支持','你不需要獨自承擔所有事。找一位信任的人聊聊，也許能看見新的方向。'],['先照顧自己','休息不是放棄。喝點水、深呼吸，讓心情安定後再做決定。'],['勇敢嘗試','如果已經思考許久，不妨選擇一個風險較低的小行動，看看會帶來什麼改變。'],['看見自己的力量','回想一次你成功克服困難的經驗。當時的勇氣與智慧，現在仍在你心裡。'],['釐清真正的心願','問問自己：我最在意的是什麼？把真正重要的事情寫下來，方向會更清楚。'],['保持彈性','事情未必只有一種答案。試著列出兩個可行選擇，再比較它們的利弊。']];const q=document.getElementById('question'),r=document.getElementById('result');let last=-1;document.getElementById('guide').addEventListener('click',()=>{let i=Math.floor(Math.random()*messages.length);if(i===last)i=(i+1)%messages.length;last=i;const [title,body]=messages[i];r.hidden=false;r.replaceChildren();const h=document.createElement('strong');h.textContent='🐯 虎爺的溫暖提醒：'+title;const p=document.createElement('p');p.textContent=body;const prompt=document.createElement('p');prompt.textContent='今天可以試試：寫下一個你願意採取的小步驟。';r.append(h,p,prompt)});document.getElementById('again').addEventListener('click',()=>{q.value='';r.hidden=true;q.focus()});</script></body></html>
